name: Generate isometric contributions metrics

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: vitorsilvestre29
          template: classic
          base: ""
          filename: metrics.svg
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          output_action: commit
          committer_branch: output
          committer_message: "chore: update metrics [Skip GitHub Action]"
          optimize: xml
          extras_css: |
            svg { background-color: #0d1117 !important; }
            svg { color: #c9d1d9 !important; }
            h2, h3 { color: #8b949e !important; }
            h2 svg, h3 svg, .field svg { fill: #8b949e !important; }
            [fill="#ebedf0"] { fill: #161b22 !important; }
            [fill="#9be9a8"] { fill: #333a42 !important; }
            [fill="#40c463"] { fill: #4d5560 !important; }
            [fill="#30a14e"] { fill: #6e7681 !important; }
            [fill="#216e39"] { fill: #c9d1d9 !important; }
